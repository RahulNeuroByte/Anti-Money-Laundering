name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: ruff check .
      
      # --- TEMPORARY DEBUG STEP ADDED HERE ---
      - name: Print raw files for debugging
        run: |
          echo "=== CONTENT OF REQUIREMENTS.TXT ==="
          cat requirements.txt
          echo "==================================="
          echo "=== CONTENT OF JOB_CONDA.YML ==="
          cat mlops/azure/environment/job_conda.yml
          echo "==================================="

      - run: pytest -q
