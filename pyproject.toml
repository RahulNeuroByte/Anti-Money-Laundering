[project]
name = "aml-capstone"
version = "0.1.0"
requires-python = "==3.11.*"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "api", "tests"]
extend-exclude = ["mlruns", "mlartifacts", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/aml/report.py" = ["E501"]
"*.ipynb" = ["E402", "E501"]
"mlops/azure/pipeline_lib.py" = ["E501"]
"mlops/azure/submit_pipeline.py" = ["E501"]
